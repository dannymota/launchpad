# A nightly copy of the production database, kept for 14 days as a workflow artifact.
# Cloudflare D1 also keeps 30 days of point-in-time history (Time Travel); this is a second
# copy that does not depend on the database still existing. The file holds people's data:
# keep this repository private. docs/OPERATIONS.md says how to restore from either.
name: backup

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Is there a database to copy?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret, so nothing is deployed yet."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-node@v5
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.ready.outputs.go == 'true'
      - name: Export
        if: steps.ready.outputs.go == 'true'
        working-directory: apps/web
        run: npx wrangler d1 export DB --remote --config wrangler.jsonc --output "$RUNNER_TEMP/database.sql"
      - uses: actions/upload-artifact@v5
        if: steps.ready.outputs.go == 'true'
        with:
          name: database-${{ github.run_id }}
          path: ${{ runner.temp }}/database.sql
          retention-days: 14
          if-no-files-found: error
