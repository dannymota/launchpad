# Every push and pull request: the same checks a person runs locally, on a clean machine.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint, types, repo rules and the Workers-runtime tests.
      - run: npm run check
      # Generated files are committed; fail when one is out of date.
      - run: npm run config:check
      - run: npm run design:context -- --check
      - run: npm run theme:check
      - run: npm run build
      - run: npm run doctor -w @app/web

  # The built product in a real browser: a stranger, a sign-in with an emailed code, a sign-out.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # What the browser showed when a test failed.
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-failures
          path: test-results/
          retention-days: 7

  # >>> mobile
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      # The shared packages the app imports resolve their own imports from the root install.
      - run: npm ci
        working-directory: .
      # The app has its own lockfile, so Expo's version pins never constrain the web app.
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo export --platform ios --output-dir dist/ios
      - run: npx expo export --platform android --output-dir dist/android
  # <<< mobile
