# Deploys staging when main changes. It does nothing until the repository has the secret
# CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID when the token can see several accounts).
# The very first deploy must name who may sign in: start this workflow by hand (Run workflow)
# and fill in "emails". Every push after that deploys by itself.
# Production is never deployed from here: that is `npm run deploy -- production`, by a person.
name: deploy-staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      emails:
        description: "First deploy only: who may sign in through Cloudflare Access (comma-separated)"
        required: false
        default: ""

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through its migrations.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Is deploying set up?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret, so there is nothing to deploy to yet."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-node@v5
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.ready.outputs.go == 'true'
      # Checks the config and Cloudflare Access, runs the full check, builds, applies
      # migrations, deploys, sets secrets, then looks at the result from outside.
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        env:
          # Passed through the environment, never pasted into the command.
          EMAILS: ${{ inputs.emails }}
        run: npm run deploy -- staging ${EMAILS:+--email "$EMAILS"}
